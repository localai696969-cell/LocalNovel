name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ĐÃ SỬA (2026-07-27): trước đây dùng `channel: stable` — nghĩa là MỖI
      # LẦN chạy workflow, Actions tải bản Flutter "stable" MỚI NHẤT TẠI ĐÚNG
      # THỜI ĐIỂM ĐÓ, không phải cùng 1 bản như lần build trước. Đây là
      # nguyên nhân gốc khiến cùng 1 bộ source code (không đổi dòng nào) có
      # thể build được ở lần này nhưng lỗi ở lần khác — không phải trùng hợp,
      # mà là hệ quả tất yếu của việc không pin version.
      #
      # QUAN TRỌNG - MINH BẠCH: con số 3.44.7 dưới đây là bản Flutter stable
      # mới nhất tại thời điểm sửa file này (tra cứu thật từ docs.flutter.dev,
      # không phải đoán) — KHÔNG có cách nào xác nhận đây có đúng là bản đã
      # từng build thành công trước đó hay không, vì tài liệu kỹ thuật của dự
      # án chưa từng ghi lại con số đó. Tác dụng thật của việc pin này là:
      # TỪ BÂY GIỜ TRỞ ĐI, mọi lần build đều dùng đúng 1 bản Flutter, không
      # còn trôi theo ngày giờ chạy nữa — nếu build lần này thành công, hãy
      # GIỮ NGUYÊN con số này, không đổi, trừ khi chủ động muốn nâng cấp.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Cài NDK mới nhất có sẵn (bản cũ không hỗ trợ SVE2/KleidiAI)
        run: |
          NEWEST_NDK=$(yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list 2>/dev/null | grep -oE "ndk;[0-9.]+" | sort -t';' -k2 -V | tail -1)
          echo "Dùng NDK: $NEWEST_NDK"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$NEWEST_NDK"
          NDK_VERSION=$(echo "$NEWEST_NDK" | cut -d';' -f2)
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV

      - name: Tăng bộ nhớ ảo để tránh hết RAM khi build C++ nặng
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Giải nén code Flutter đã upload
        run: unzip local_novel.zip -d extracted

      - name: Sinh khung project Flutter đầy đủ (android/, ios/...)
        run: flutter create --org com.localnovel --project-name local_novel scaffold

      # ĐÃ THÊM (2026-07-27, lần 4 — dựa trên bằng chứng thật, không đoán):
      # log build lần #46 cho thấy đúng nguyên nhân: file build.gradle THẬT
      # của package `jni` (đọc trực tiếp từ pub-cache) có đoạn:
      #   def agpMajor = ...ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0]
      #   if (agpMajor < 9) { apply plugin: 'kotlin-android' }
      #   ...
      #   kotlin { compilerOptions { ... } }   // dòng gây lỗi
      # Nghĩa là: `jni` CHỈ tự áp dụng plugin Kotlin khi AGP < 9. Scaffold
      # Flutter hiện sinh ra AGP "9.0.1" (thấy trong settings.gradle.kts log
      # thật) → điều kiện sai → plugin Kotlin không được áp dụng → khối
      # `kotlin {...}` ở dòng 84 không tìm thấy extension tương ứng → lỗi.
      # Tài liệu chính thức Android Developers cũng xác nhận AGP 9.0 đổi
      # sang "built-in Kotlin", và plugin org.jetbrains.kotlin.android CŨ
      # "không tương thích với DSL mới" của AGP 9 — nên không tự ép áp dụng
      # lại plugin cũ vào project dùng AGP 9 (sẽ đụng đúng điều Google nói là
      # không tương thích). Cách chắc ăn hơn: hạ AGP xuống dưới 9, đúng nhánh
      # code mà `jni` đã viết/test.
      #
      # Version cụ thể dùng — có bằng chứng, không đoán:
      # - AGP 8.13.0: tài liệu chính thức Android Developers ghi rõ
      #   "AGP 8.13 now requires Gradle 8.13" — cặp version khớp nhau xác
      #   nhận được, không phải suy đoán.
      # - Gradle 8.13: đúng theo yêu cầu ở trên.
      # - Kotlin 2.1.20: bản ổn định, thuộc dải "Kotlin 2.1.x + AGP 8.x" đã
      #   được ghi nhận là tổ hợp chạy ổn định trước khi hệ sinh thái chuyển
      #   sang AGP 9 (không có bằng chứng trực tiếp xác nhận đúng bản lẻ
      #   2.1.20 với đúng Gradle 8.13 — đây là phần có rủi ro thấp còn sót
      #   lại, sẽ biết ngay qua log nếu cần chỉnh thêm).
      - name: Hạ AGP xuống dưới 9 + Gradle khớp version (khớp đúng điều kiện mà package jni yêu cầu)
        run: |
          python3 -c "
          import glob
          candidates = glob.glob('scaffold/android/settings.gradle.kts') + glob.glob('scaffold/android/settings.gradle')
          assert candidates, 'Khong tim thay settings.gradle'
          path = candidates[0]
          print('=== Noi dung ' + path + ' TRUOC khi ha AGP/Kotlin ===')
          content = open(path).read()
          print(content)
          content = content.replace('version \"9.0.1\"', 'version \"8.13.0\"').replace(\"version '9.0.1'\", \"version '8.13.0'\")
          content = content.replace('version \"2.3.20\"', 'version \"2.1.20\"').replace(\"version '2.3.20'\", \"version '2.1.20'\")
          open(path, 'w').write(content)
          print('=== Noi dung ' + path + ' SAU khi ha AGP/Kotlin ===')
          print(content)
          "
          python3 -c "
          import re, glob
          candidates = glob.glob('scaffold/android/gradle/wrapper/gradle-wrapper.properties')
          assert candidates, 'Khong tim thay gradle-wrapper.properties'
          path = candidates[0]
          content = open(path).read()
          print('=== Noi dung gradle-wrapper.properties TRUOC khi sua ===')
          print(content)
          new_content = re.sub(r'gradle-[0-9.]+-(bin|all)\.zip', 'gradle-8.13-bin.zip', content)
          open(path, 'w').write(new_content)
          print('=== Noi dung gradle-wrapper.properties SAU khi sua ===')
          print(new_content)
          "

      - name: Nâng minSdk lên 28 (yêu cầu bởi engine AI local)
        run: |
          find scaffold/android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i \
            -e 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 28/' \
            -e 's/minSdkVersion = flutter\.minSdkVersion/minSdkVersion = 28/' \
            -e 's/minSdk = flutter\.minSdkVersion/minSdk = 28/' \
            -e 's/minSdk flutter\.minSdkVersion/minSdk 28/' {} \;

      - name: Ghép code Dart đã viết vào khung vừa sinh
        run: |
          rm -rf scaffold/lib
          cp -r extracted/local_novel/lib scaffold/lib
          cp extracted/local_novel/pubspec.yaml scaffold/pubspec.yaml
          # ĐÃ THÊM (2026-07-27): nếu source zip đã có sẵn pubspec.lock (từ
          # lần build trước, tự tải về qua artifact "pubspec-lock" ở cuối
          # workflow này) thì copy luôn qua — `flutter pub get` sẽ tôn trọng
          # file lock này, không tự ý nâng version bất kỳ gói nào (kể cả gói
          # gián tiếp như jni) nữa. Nếu chưa có (lần đầu chạy với bản sửa
          # này), bỏ qua bình thường, không lỗi.
          if [ -f extracted/local_novel/pubspec.lock ]; then
            echo "Tìm thấy pubspec.lock có sẵn trong source — dùng lại để khoá version."
            cp extracted/local_novel/pubspec.lock scaffold/pubspec.lock
          else
            echo "CHƯA có pubspec.lock trong source — pub sẽ tự giải cây dependency mới. Nhớ tải artifact 'pubspec-lock' ở cuối lần chạy này, đưa vào cùng chỗ pubspec.yaml trong zip nguồn, để lần sau khoá version lại."
          fi

      - name: Đổi tên app hiển thị thành LocalNovel
        run: sed -i 's/android:label="[^"]*"/android:label="LocalNovel"/' scaffold/android/app/src/main/AndroidManifest.xml

      - name: Thêm quyền Internet và truy cập file cho Android
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/><application#' scaffold/android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' scaffold/android/app/src/main/AndroidManifest.xml

      - name: Cài thư viện Dart
        working-directory: scaffold
        run: flutter pub get

      # ĐÃ THÊM (2026-07-27): vá lỗi build "Could not find method kotlin()
      # for arguments [...] on project ':jni'" — package `jni` không được
      # khai báo trực tiếp trong pubspec.yaml của app, nó bị 1 gói khác kéo
      # vào gián tiếp ở bản 1.0.1, bản này có build.gradle gọi hàm kotlin()
      # không tương thích với tổ hợp Gradle/Kotlin/AGP hiện tại. Bản `jni`
      # mới hơn đã bỏ hẳn cách gọi này (xem changelog chính thức: "Removed
      # the dependency on kotlin_gradle_plugin"). Dùng --major-versions để
      # luôn lấy đúng bản MỚI NHẤT thật có trên pub.dev tại thời điểm build,
      # không cần hardcode số phiên bản (số đó sẽ đổi theo thời gian, hardcode
      # vào đây sẽ lại lỗi thời y như jni: 1.0.1 đang lỗi bây giờ).
      #
      # SỬA LẠI (2026-07-27, lần 2): bước trước dùng `grep -q "^jni "` để
      # kiểm tra jni có trong cây dependency không trước khi nâng cấp — NHƯNG
      # `flutter pub deps --style=list` in ra dạng "- jni 1.0.1" (có "- " ở
      # đầu dòng), không phải "jni 1.0.1" như điều kiện giả định. Nghĩa là
      # điều kiện đó gần như luôn sai, bước nâng cấp CHƯA TỪNG được gọi ở lần
      # build trước — đây là lý do lỗi lặp lại y hệt dù đã "thêm bước vá".
      # Bỏ hẳn logic kiểm tra, làm trực tiếp + in rõ version TRƯỚC và SAU để
      # có bằng chứng thật (không đoán) cho lần đọc log tiếp theo:
      # SỬA LẠI (2026-07-27, lần 3): log thật từ lần build trước cho thấy
      # `flutter pub upgrade jni --major-versions` LUÔN thất bại với lý do
      # rất cụ thể: lệnh này chỉ hợp lệ với dependency KHAI BÁO TRỰC TIẾP,
      # trong khi jni trước đó chỉ là transitive — không phải lỗi cú pháp gì
      # cả, mà là giới hạn thật của công cụ pub. Đã thêm `jni: any` trực tiếp
      # vào pubspec.yaml (xem comment ở đó) để bước này giờ mới thực sự hợp
      # lệ và chạy được.
      - name: Nâng jni lên bản mới nhất (vá lỗi kotlin() Gradle không tương thích)
        working-directory: scaffold
        run: |
          echo "=== Version jni TRƯỚC khi nâng cấp ==="
          grep -A2 '^  jni:' pubspec.lock 2>/dev/null || echo "(chưa có pubspec.lock hoặc jni không có trong đó)"
          flutter pub upgrade jni --major-versions || echo "!!! flutter pub upgrade jni VẪN thất bại dù đã khai báo trực tiếp — xem kỹ log ngay phía trên dòng này, đây sẽ là bằng chứng quan trọng nhất nếu lỗi vẫn còn."
          echo "=== Version jni SAU khi nâng cấp (đọc thẳng từ pubspec.lock, không suy đoán) ==="
          grep -A2 '^  jni:' pubspec.lock 2>/dev/null || echo "(vẫn không thấy jni trong pubspec.lock — bất thường, cần xem log 'flutter pub upgrade' phía trên)"

      # ĐÃ THÊM (2026-07-27): lưu lại đúng pubspec.lock THẬT của lần build
      # này (dù thành công hay thất bại ở các bước sau) — để tải về, đưa vào
      # zip nguồn cho lần sau, từ đó khoá version, không còn trôi nữa.
      - name: Lưu lại pubspec.lock của lần build này (để khoá version cho lần sau)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: scaffold/pubspec.lock

      # ĐÃ THÊM (2026-07-27, lần 2): in thẳng nội dung THẬT của build.gradle
      # bên trong package jni (đọc từ pub-cache, không phải suy đoán) — nếu
      # bước nâng cấp ở trên vẫn không đủ (vd bản mới nhất của jni cũng có
      # cùng vấn đề, hoặc lỗi thật ra nằm ở phiên bản Kotlin Gradle Plugin mà
      # scaffold Flutter tự sinh ra chứ không phải ở bản thân jni), log này
      # cho biết chính xác dòng nào đang gọi kotlin(...) và trong bối cảnh
      # nào — để sửa đúng chỗ ở lần tiếp theo, không phải đoán mò nữa.
      - name: In nội dung build.gradle thật của package jni (chẩn đoán, không sửa gì)
        run: |
          # SỬA LẠI (2026-07-27, lần 3): pattern find trước đó quá lỏng,
          # khớp NHẦM cả file trong "example/android/build.gradle" (project
          # mẫu đóng gói kèm package, vô hại, không liên quan) — và vì dùng
          # `head -1`, nó lấy đúng file sai đó. Giới hạn rõ: chỉ tìm
          # "<tên gói>/android/build.gradle" ở ĐÚNG 1 cấp dưới thư mục gói,
          # loại trừ hẳn mọi đường dẫn có "/example/".
          JNI_DIR="$(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -name 'jni-*' -type d | sort -V | tail -1)"
          echo "Thư mục package jni tìm thấy: $JNI_DIR"
          JNI_GRADLE="$JNI_DIR/android/build.gradle"
          if [ -f "$JNI_GRADLE" ]; then
            echo "=== Nội dung đầy đủ build.gradle THẬT của jni (không phải example) ==="
            cat -n "$JNI_GRADLE"
          else
            echo "Không thấy file tại $JNI_GRADLE — liệt kê toàn bộ cây thư mục để đối chiếu:"
            find "$JNI_DIR" -maxdepth 3
          fi
          echo "=== Version Kotlin Gradle Plugin mà scaffold Flutter tự sinh ra (settings.gradle) ==="
          find scaffold/android -maxdepth 1 -name "settings.gradle*" -exec cat {} \;

      - name: Clone mã nguồn chính thức MNN (Alibaba)
        run: git clone --depth 1 https://github.com/alibaba/MNN.git

      # QNN backend của MNN cần header + thư viện thật của Qualcomm
      # (QnnInterface.h...) — đây là SDK độc quyền, MNN không mang theo
      # sẵn. Bản "Community" tải công khai được, không cần đăng nhập tài
      # khoản Qualcomm — đúng theo hướng dẫn chính thức của MNN
      # (mnn-docs.readthedocs.io/en/latest/inference/npu.html).
      - name: Tải QNN SDK (Qualcomm) và đặt đúng chỗ MNN yêu cầu
        run: |
          wget --progress=dot:giga https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.40.0.251030/v2.40.0.251030.zip -O qnn_sdk.zip
          echo "=== Kích thước file đã tải (nếu quá nhỏ, khả năng cao là trang lỗi chứ không phải SDK thật) ==="
          ls -la qnn_sdk.zip
          file qnn_sdk.zip
          unzip -q qnn_sdk.zip -d qnn_sdk
          echo "=== Cây thư mục sau khi giải nén (để xác nhận đúng cấu trúc thật, không đoán maxdepth) ==="
          find qnn_sdk -maxdepth 3
          QNN_SDK_ROOT="$(cd "$(dirname "$(find qnn_sdk -name QNN_README.txt | head -1)")" && pwd)"
          echo "QNN_SDK_ROOT (tuyệt đối)=$QNN_SDK_ROOT"
          if [ -z "$QNN_SDK_ROOT" ]; then
            echo "KHÔNG tìm thấy QNN_README.txt — xem cây thư mục ở trên để biết cấu trúc thật, dừng lại ở đây thay vì lỗi mơ hồ tiếp"
            exit 1
          fi
          echo "QNN_SDK_ROOT=$QNN_SDK_ROOT" >> $GITHUB_ENV
          mkdir -p MNN/source/backend/qnn/3rdParty
          cp -r "$QNN_SDK_ROOT/include/QNN" MNN/source/backend/qnn/3rdParty/include
          cp -r "$QNN_SDK_ROOT/lib" MNN/source/backend/qnn/3rdParty/lib
          echo "=== Xác nhận QnnInterface.h đã có đúng chỗ ==="
          find MNN/source/backend/qnn/3rdParty -name "QnnInterface.h"

      - name: Build engine MNN native (bật LLM + OpenCL GPU + QNN NPU)
        working-directory: MNN/project/android
        run: |
          mkdir build_64
          cd build_64
          ../build_64.sh "-DMNN_LOW_MEMORY=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_BUILD_LLM=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_ARM82=true -DMNN_USE_LOGCAT=true -DMNN_OPENCL=true -DMNN_QNN=true -DMNN_SEP_BUILD=OFF -DCMAKE_INSTALL_PREFIX=."
          make install

      - name: In cấu trúc thư mục install thật (để xác nhận đúng đường dẫn .so/header trước khi build cầu nối)
        run: |
          echo "=== Toàn bộ cây thư mục install ==="
          find MNN/project/android/build_64 -maxdepth 4 -type d
          echo "=== Toàn bộ file .so tạo ra ==="
          find MNN/project/android/build_64 -name "*.so"
          echo "=== Toàn bộ header llm.hpp (nếu có) — đối chiếu tên hàm thật trước khi build cầu nối ==="
          find MNN -path "*llm/engine/include*" -name "*.hpp" -exec echo "--- {} ---" \; -exec cat {} \;

      - name: Ghép code native (Kotlin + JNI) vào project Android
        run: |
          # Không đoán/hardcode đường dẫn package — dò ĐÚNG vị trí + package
          # thật mà `flutter create --org com.localnovel --project-name local_novel`
          # vừa sinh ra cho MainActivity mặc định. Lệnh create ở trên ghép
          # org + tên project thành package thật là "com.localnovel.local_novel",
          # KHÁC với "com.localnovel" mà bước này từng hardcode — đây chính là
          # nguyên nhân MainActivity thật của chúng ta (có đăng ký MethodChannel)
          # không bao giờ được Android chạy tới, gây MissingPluginException dù
          # build/cài đặt vẫn "thành công" bình thường.
          DEFAULT_MAIN_ACTIVITY="$(find scaffold/android/app/src/main -name 'MainActivity.kt' -o -name 'MainActivity.java' | head -1)"
          echo "MainActivity mặc định do flutter create sinh ra tại: $DEFAULT_MAIN_ACTIVITY"
          test -n "$DEFAULT_MAIN_ACTIVITY" || { echo "KHÔNG tìm thấy MainActivity mặc định — cấu trúc scaffold đã đổi khác, dừng lại thay vì đoán tiếp"; exit 1; }

          REAL_PACKAGE="$(grep -oP '(?<=^package )[a-zA-Z0-9_.]+' "$DEFAULT_MAIN_ACTIVITY")"
          echo "Package thật của app: $REAL_PACKAGE"
          REAL_PACKAGE_PATH="$(echo "$REAL_PACKAGE" | tr '.' '/')"

          rm -f "$DEFAULT_MAIN_ACTIVITY"
          mkdir -p "scaffold/android/app/src/main/kotlin/$REAL_PACKAGE_PATH"
          mkdir -p scaffold/android/app/src/main/kotlin/com/localnovel/mnnbridge

          cp extracted/local_novel/android_native/app/src/main/kotlin/com/localnovel/MainActivity.kt \
             "scaffold/android/app/src/main/kotlin/$REAL_PACKAGE_PATH/MainActivity.kt"
          sed -i "1s/^package .*/package $REAL_PACKAGE/" \
             "scaffold/android/app/src/main/kotlin/$REAL_PACKAGE_PATH/MainActivity.kt"

          cp extracted/local_novel/android_native/app/src/main/kotlin/com/localnovel/mnnbridge/*.kt \
             scaffold/android/app/src/main/kotlin/com/localnovel/mnnbridge/

          mkdir -p scaffold/android/app/src/main/cpp
          cp extracted/local_novel/android_native/app/src/main/cpp/mnn_bridge.cpp scaffold/android/app/src/main/cpp/
          cp extracted/local_novel/android_native/app/src/main/cpp/CMakeLists.txt scaffold/android/app/src/main/cpp/

          echo "=== XAC NHAN (2026-07-28): mnn_bridge.cpp THAT SU dang duoc dung de build co chua dong sua createLLM/llm_config.json hay khong ==="
          if grep -q "duong dan config THAT dung de goi createLLM" scaffold/android/app/src/main/cpp/mnn_bridge.cpp; then
            echo "✅ CO — dong sua ve llm_config.json DA co mat trong file se duoc bien dich lan nay."
          else
            echo "💥 KHONG THAY — file mnn_bridge.cpp dang duoc dung KHONG chua ban sua createLLM/llm_config.json. Kiem tra lai zip source da upload dung ban moi nhat chua."
          fi

          echo "=== Xác nhận nội dung MainActivity.kt cuối cùng (phải thấy dòng đăng ký MethodChannel) ==="
          cat "scaffold/android/app/src/main/kotlin/$REAL_PACKAGE_PATH/MainActivity.kt"

      - name: Biên dịch cầu nối JNI (mnn_bridge.cpp), liên kết với engine MNN vừa build
        run: |
          MNN_INSTALL_DIR="$(pwd)/MNN/project/android/build_64"
          cmake -B build_bridge -S scaffold/android/app/src/main/cpp \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DMNN_INSTALL_DIR="$MNN_INSTALL_DIR"
          cmake --build build_bridge --config Release

      - name: Đặt file .so vào đúng chỗ Android tự nhận (jniLibs) — không cần sửa Gradle
        run: |
          mkdir -p scaffold/android/app/src/main/jniLibs/arm64-v8a
          find build_bridge -name "libmnn_bridge.so" -exec cp {} scaffold/android/app/src/main/jniLibs/arm64-v8a/ \;
          find MNN/project/android/build_64 -name "*.so" -exec cp {} scaffold/android/app/src/main/jniLibs/arm64-v8a/ \;
          HEXAGON_ARCH=68
          QNN_LIB_DIR="MNN/source/backend/qnn/3rdParty/lib"
          cp "$QNN_LIB_DIR/aarch64-android/libQnnHtp.so" scaffold/android/app/src/main/jniLibs/arm64-v8a/ 2>&1 || echo "THIẾU libQnnHtp.so — xem log tải QNN SDK ở bước trước"
          cp "$QNN_LIB_DIR/aarch64-android/libQnnHtpPrepare.so" scaffold/android/app/src/main/jniLibs/arm64-v8a/ 2>&1 || echo "THIẾU libQnnHtpPrepare.so"
          cp "$QNN_LIB_DIR/aarch64-android/libQnnHtpV${HEXAGON_ARCH}Stub.so" scaffold/android/app/src/main/jniLibs/arm64-v8a/ 2>&1 || echo "THIẾU libQnnHtpV${HEXAGON_ARCH}Stub.so — có thể sai HEXAGON_ARCH, xem danh sách file thật ở dòng dưới"
          cp "$QNN_LIB_DIR/hexagon-v${HEXAGON_ARCH}/unsigned/libQnnHtpV${HEXAGON_ARCH}Skel.so" scaffold/android/app/src/main/jniLibs/arm64-v8a/ 2>&1 || echo "THIẾU libQnnHtpV${HEXAGON_ARCH}Skel.so — có thể sai HEXAGON_ARCH"
          echo "=== Toàn bộ thư mục lib thật trong QNN SDK (đối chiếu nếu HEXAGON_ARCH ở trên sai) ==="
          find "$QNN_LIB_DIR" -maxdepth 2 -type d
          echo "=== Danh sách .so đã đặt vào jniLibs ==="
          ls -la scaffold/android/app/src/main/jniLibs/arm64-v8a/

      - name: Thêm dependency QNN runtime (Qualcomm, Maven Central) + Kotlin coroutines vào build.gradle
        run: |
          echo "=== Nội dung build.gradle app thật, trước khi sửa (để đối chiếu nếu sed dưới không khớp) ==="
          cat scaffold/android/app/build.gradle* 2>/dev/null
          find scaffold/android/app -name "build.gradle*" -exec sed -i \
            -e '/dependencies {/a\implementation("com.qualcomm.qti:qnn-runtime:2.42.0")\implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")' {} \;

      - name: Kiểm tra build.gradle đã thêm dependency thành công chưa
        run: cat scaffold/android/app/build.gradle*

      # ================== HẾT PHẦN CŨ ==================

      # QUAN TRỌNG: đã xác nhận qua log debug thật trên máy — JNI
      # GetMethodID("onToken", ...) trả về NULL ở bản release, tên lớp
      # thật lúc chạy bị đổi thành "a0.a" (dấu hiệu R8/ProGuard đổi tên
      # kinh điển). Theo tài liệu chính thức Flutter, các bản gần đây
      # KHÔNG tắt được code shrinking cho bản release nữa (--no-shrink hết
      # tác dụng) — nên KHÔNG cố tắt R8 nữa, mà thêm đúng luật "-keep" bảo
      # vệ interface TokenCallback (và cả package com.localnovel nói
      # chung, phòng hờ chỗ khác) khỏi bị đổi tên — cách chính thức được
      # khuyến nghị để dùng JNI cùng R8.
      - name: Thêm luật ProGuard "-keep" bảo vệ code gọi qua JNI khỏi bị R8 đổi tên
        run: |
          python3 -c "
          rules = '\n# --- LocalNovel: giu nguyen ten cac lop/ham goi qua JNI ---\n-keep class com.localnovel.** { *; }\n-keepclassmembers class com.localnovel.** { *; }\n-keep interface com.localnovel.** { *; }\n'
          with open('scaffold/android/app/proguard-rules.pro', 'a') as f:
              f.write(rules)
          print('=== Noi dung proguard-rules.pro SAU khi them luat ===')
          print(open('scaffold/android/app/proguard-rules.pro').read())
          "
          python3 -c "
          import re, glob
          candidates = glob.glob('scaffold/android/app/build.gradle') + glob.glob('scaffold/android/app/build.gradle.kts')
          assert candidates, 'Khong tim thay build.gradle'
          path = candidates[0]
          content = open(path).read()
          if 'proguardFiles' in content:
              print(path + ' da co proguardFiles tu truoc, khong can them.')
          else:
              is_kts = path.endswith('.kts')
              line = '            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")\n' if is_kts else '            proguardFiles getDefaultProguardFile(\'proguard-android-optimize.txt\'), \'proguard-rules.pro\'\n'
              match = re.search(r'release\s*\{', content)
              assert match, 'Khong tim thay khoi release { trong ' + path
              insert_at = match.end()
              content = content[:insert_at] + '\n' + line + content[insert_at:]
              open(path, 'w').write(content)
              print('Da them dong proguardFiles vao ' + path)
          print('=== Noi dung ' + path + ' SAU khi kiem tra/sua ===')
          print(open(path).read())
          "

      - name: Build APK
        working-directory: scaffold
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: LocalNovel-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
